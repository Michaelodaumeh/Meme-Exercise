<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO</title>
    <link rel="stylesheet" href="meme.css">
</head>
<body>
  <h1>WINSTON MEMO GENERATOR</h1> 
  <P>Fill out the form to start creating memes!</P>
  <form action="" id="memeForm">
    <label for="url" class="url">Image URL</label>
    <div class="center-container">
        <input type="url" id="imageUrl" placeholder="What's the URL for your meme image?" required>
      </div>
    
    <label for="top" class="top">Text On Top</label>
    <div class="center-container">
        <input type="text" name="top" id="topText"
         placeholder="(optional) what text do you want at the top of the meme?">
      </div>

    <label for="bottom" class="bottom">Text On Bottom</label>
    <div class="center-container">
        <input type="text" name="bottom" id="bottomText" 
        placeholder="(optional) what text do you want at the bottom of the meme?">
      </div>
      <div class="button-wrapper">
    <button type="submit" class="sumit-button">Generate Meme</button>
  </div>
  </form>

  <div  id="memeContainer" class="meme-container">

  </div>
<script src="memo.js"></script>
</body>
</html>
