<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winston Meme Generator</title>
  <link rel="stylesheet" href="meme.css">
</head>
<body>
  <h1>WINSTON MEME GENERATOR</h1>
  <p>Fill out the form to start creating memes!</p>

  <form id="memeForm">
    <label for="imageUrl">Image URL</label>
    <div class="center-container">
      <input type="url" id="imageUrl" placeholder="Enter your meme image URL" required>
    </div>

    <label for="topText">Text On Top</label>
    <div class="center-container">
      <input type="text" id="topText" placeholder="Text at the top of the meme (optional)">
    </div>

    <label for="bottomText">Text On Bottom</label>
    <div class="center-container">
      <input type="text" id="bottomText" placeholder="Text at the bottom of the meme (optional)">
    </div>

    <div class="button-wrapper">
      <button type="submit">Generate Meme</button>
    </div>
  </form>

  <div id="memeContainer" class="meme-container"></div>

  <script src="memo.js"></script>
</body>
</html>
